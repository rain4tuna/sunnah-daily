name: Cek Token IG

on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cek akun IG
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python cek_ig.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tulis hasil sebagai anotasi
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python cek_ig.py 2>&1 | sed 's/^/::notice::/' || true
