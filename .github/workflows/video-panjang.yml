name: Video Panjang YouTube (16:9)

# Satu episode Sirah utuh jadi satu video 16:9 (video_panjang.py). Hanya dijalankan manual.
# TIDAK memposting ke mana pun dan TIDAK mengubah data kisah: hasilnya diunduh dari Artifacts
# (dan disalin ke branch hasil-panjang bila ukurannya < 95 MB) untuk dicek dulu.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Nomor episode Sirah (wajib)'
        required: true
        default: '11'
      suara:
        description: 'Voice Gemini TTS (kosong = Laomedeia untuk naskah anak, Charon untuk naskah asli)'
        required: false
        default: ''
      maks_kisah:
        description: 'Batasi jumlah kisah untuk uji cepat (kosong = semua)'
        required: false
        default: ''
      gaya:
        description: 'clay (aset clay) | svg (ilustrasi SVG lama)'
        required: false
        default: 'clay'
      naskah:
        description: 'anak (ceria + ajakan + kuis) | asli (narasi storyboard apa adanya)'
        required: false
        default: 'anak'

permissions:
  contents: write

concurrency:
  group: video-panjang
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 ffmpeg
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion
        working-directory: remotion
        run: |
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Buat video panjang
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE: ${{ github.event.inputs.episode }}
          SUARA_PANJANG: ${{ github.event.inputs.suara }}
          MAKS_KISAH: ${{ github.event.inputs.maks_kisah }}
          GAYA_PANJANG: ${{ github.event.inputs.gaya }}
          GAYA_NASKAH: ${{ github.event.inputs.naskah }}
          # Konkurensi 4 membuat font (delayRender "font") melewati batas waktu; 2 seperti render Shorts.
          REMOTION_POTONG_PANJANG: '300'
          REMOTION_KONKURENSI: '2'
          REMOTION_TIMEOUT: '180000'
          OUT_DIR: hasil
        run: |
          mkdir -p hasil
          set -o pipefail
          python video_panjang.py 2>&1 | tee hasil/log.txt

      - name: Unggah hasil (7 hari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-panjang-${{ github.run_number }}
          path: hasil/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salin ke branch hasil-panjang (untuk ditinjau)
        if: always()
        run: |
          # naskah & log selalu disalin (juga saat gagal) supaya bisa dicek; video hanya bila < 95 MB
          ls hasil/* >/dev/null 2>&1 || exit 0
          for f in hasil/*.mp4; do [ -f "$f" ] && [ $(stat -c%s "$f") -ge 95000000 ] && { echo "::warning::$f > 95 MB, hanya di Artifacts"; rm -f "$f"; }; done
          git config user.name "sunnah-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/h && cp hasil/* /tmp/h/
          git checkout -q --orphan hasil-panjang-tmp
          git rm -rfq --cached . && git clean -fdxq -e hasil
          rm -rf hasil && cp /tmp/h/* .
          git add -A && git commit -qm "Video panjang run ${{ github.run_number }} (${{ job.status }})" && git push -qf origin HEAD:hasil-panjang
