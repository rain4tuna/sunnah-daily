name: Buat Video Sunnah Daily

on:
  schedule:
    - cron: '17 22 * * *'   # 05.17 WIB
    - cron: '47 4 * * *'    # 11.47 WIB
    - cron: '37 8 * * *'    # 15.37 WIB
    - cron: '47 11 * * *'   # 18.47 WIB
    - cron: '13 14 * * *'   # 21.13 WIB
  workflow_dispatch:
    inputs:
      uji:
        description: 'true = buat video saja (unduh di Artifacts), status kisah tidak diubah'
        required: false
        default: 'true'
      episode:
        description: 'Nomor episode (kosong = otomatis)'
        required: false
        default: ''
      kisah:
        description: 'Nomor urut kisah di episode (kosong = otomatis)'
        required: false
        default: ''
      tema:
        description: 'siang | malam | auto'
        required: false
        default: 'auto'
      posting_ig:
        description: 'true = posting ke IG (hanya kalau uji = false)'
        required: false
        default: 'false'
      posting_yt:
        description: 'true = upload ke YouTube Shorts (hanya kalau uji = false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: buat-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ambil data kisah terbaru (run yang antre tidak boleh pakai data lama)
        run: git pull -q --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 ffmpeg
          pip install -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'raqm tidak aktif'"

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UJI: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.uji || 'true' }}
          EPISODE: ${{ github.event.inputs.episode }}
          KISAH: ${{ github.event.inputs.kisah }}
          TEMA: ${{ github.event.inputs.tema || 'auto' }}
          POSTING_IG: ${{ github.event.inputs.posting_ig || 'true' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841438717756877'
          POSTING_YT: ${{ github.event.inputs.posting_yt || 'true' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_DIR: hasil
          JADWAL: ${{ github.event_name }}
        run: |
          mkdir -p hasil
          set -o pipefail
          python main.py 2>&1 | tee hasil/log.txt

      - name: Simpan hasil ekstraksi kisah
        if: always()
        run: |
          git config user.name "sunnah-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kisah DAFTAR_POSTINGAN.md || true
          git diff --cached --quiet || (git commit -m "Data kisah diperbarui" && (git push || (git pull --rebase -q origin main && git push)))

      - name: Unggah video (7 hari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnah-daily-${{ github.run_number }}
          path: hasil/
          retention-days: 7
          if-no-files-found: ignore

      - name: Simpan video ke branch hasil (untuk ditinjau)
        if: always()
        run: |
          [ -d hasil ] && [ "$(ls -A hasil)" ] || exit 0
          mkdir -p /tmp/h && cp hasil/* /tmp/h/
          git checkout -q --orphan hasil-tmp
          git rm -rfq --cached . && git clean -fdq -e hasil
          rm -rf hasil && cp /tmp/h/* .
          git add -A && git commit -qm "Hasil run ${{ github.run_number }}" && git push -qf origin HEAD:hasil
