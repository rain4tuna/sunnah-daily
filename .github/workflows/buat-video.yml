name: Buat Video Sunnah Daily

on:
  schedule:
    - cron: '17 22 * * *'   # 05.17 WIB
    - cron: '47 4 * * *'    # 11.47 WIB
    - cron: '37 8 * * *'    # 15.37 WIB
    - cron: '47 11 * * *'   # 18.47 WIB
    - cron: '13 14 * * *'   # 21.13 WIB
  workflow_dispatch:
    inputs:
      uji:
        description: 'true = buat video saja (unduh di Artifacts), status kisah tidak diubah'
        required: false
        default: 'true'
      episode:
        description: 'Nomor episode (kosong = otomatis)'
        required: false
        default: ''
      kisah:
        description: 'Nomor urut kisah di episode (kosong = otomatis)'
        required: false
        default: ''
      seri:
        description: 'sirah | harian (kosong = otomatis: 11.47 & 18.47 harian, lainnya sirah)'
        required: false
        default: ''
      gaya:
        description: 'remotion = ilustrasi bergerak | ikon = template lama (kosong = remotion)'
        required: false
        default: ''
      gaya_ikon:
        description: 'papan | flat | kertas (kosong = bergiliran)'
        required: false
        default: ''
      tema:
        description: 'siang | malam | auto'
        required: false
        default: 'auto'
      posting_ig:
        description: 'true = posting ke IG (hanya kalau uji = false)'
        required: false
        default: 'false'
      posting_yt:
        description: 'true = upload ke YouTube Shorts (hanya kalau uji = false)'
        required: false
        default: 'false'
      posting_fb:
        description: 'true = posting Reel ke Facebook Page (hanya kalau uji = false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: buat-video
  cancel-in-progress: false

env:
  # Template untuk jadwal otomatis diatur di sini (ikon | remotion); input "gaya" hanya berlaku untuk run manual.
  GAYA_TEMPLATE: ${{ github.event.inputs.gaya || 'remotion' }}

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ambil data kisah terbaru (run yang antre tidak boleh pakai data lama)
        run: git pull -q --ff-only origin "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 ffmpeg
          pip install -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'raqm tidak aktif'"

      # Template Remotion hanya dipasang kalau dipilih, supaya run biasa tidak bertambah lama.
      - uses: actions/setup-node@v4
        if: env.GAYA_TEMPLATE == 'remotion'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion
        if: env.GAYA_TEMPLATE == 'remotion'
        working-directory: remotion
        run: |
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Buat video
        env:
          GAYA: ${{ env.GAYA_TEMPLATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UJI: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.uji || 'true' }}
          EPISODE: ${{ github.event.inputs.episode }}
          KISAH: ${{ github.event.inputs.kisah }}
          TEMA: ${{ github.event.inputs.tema || 'auto' }}
          SERI: ${{ github.event.inputs.seri }}
          GAYA_IKON: ${{ github.event.inputs.gaya_ikon }}
          POSTING_IG: ${{ github.event.inputs.posting_ig || 'true' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841438717756877'
          POSTING_YT: ${{ github.event.inputs.posting_yt || 'true' }}
          POSTING_FB: ${{ github.event.inputs.posting_fb || 'true' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_DIR: hasil
          JADWAL: ${{ github.event_name }}
        run: |
          mkdir -p hasil
          set -o pipefail
          python main.py 2>&1 | tee hasil/log.txt

      - name: Simpan hasil ekstraksi kisah
        if: always()
        run: |
          git config user.name "sunnah-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kisah DAFTAR_POSTINGAN.md || true
          git diff --cached --quiet || (git commit -m "Data kisah diperbarui" && (git push || (git pull --rebase -q origin "$GITHUB_REF_NAME" && git push)))

      - name: Unggah video (7 hari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnah-daily-${{ github.run_number }}
          path: hasil/
          retention-days: 7
          if-no-files-found: ignore

      - name: Simpan video ke branch hasil (untuk ditinjau)
        if: always()
        run: |
          ls hasil/*.mp4 >/dev/null 2>&1 || exit 0     # slot yang dilewati tidak menimpa video terakhir
          mkdir -p /tmp/h && cp hasil/* /tmp/h/
          git checkout -q --orphan hasil-tmp
          # -x: buang juga berkas yang diabaikan git (node_modules Remotion, __pycache__) supaya tidak ikut ter-commit
          git rm -rfq --cached . && git clean -fdxq -e hasil
          rm -rf hasil && cp /tmp/h/* .
          git add -A && git commit -qm "Hasil run ${{ github.run_number }}" && git push -qf origin HEAD:hasil
