name: Posting Ulang

on:
  workflow_dispatch:
    inputs:
      berkas:
        description: 'Nama video di branch hasil, tanpa .mp4 (mis. ep001-03)'
        required: true
      tujuan:
        description: 'ig | yt | semua | cek-yt'
        required: false
        default: 'ig'

jobs:
  posting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil video dari branch hasil
        run: |
          git fetch -q origin hasil
          git show origin/hasil:${{ github.event.inputs.berkas }}.mp4 > ${{ github.event.inputs.berkas }}.mp4
          git show origin/hasil:${{ github.event.inputs.berkas }}_caption.txt > ${{ github.event.inputs.berkas }}_caption.txt
      - name: Posting
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BERKAS: ${{ github.event.inputs.berkas }}
          TUJUAN: ${{ github.event.inputs.tujuan }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python posting_uji.py
