name: Posting Ulang

on:
  workflow_dispatch:
    inputs:
      berkas:
        description: 'Nama video di branch hasil, tanpa .mp4 (mis. ep001-03)'
        required: true
      tujuan:
        description: 'ig | yt | fb | tt | tg | semua | cek-yt | cek-tt | cek-tg'
        required: false
        default: 'ig'
      run_id:
        description: 'ID run Buat Video asal video (kosong = ambil dari branch hasil)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  posting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil video dari artifact run
        if: github.event.inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
          merge-multiple: true
      - name: Ambil video dari branch hasil
        if: github.event.inputs.run_id == '' && github.event.inputs.tujuan != 'cek-yt' && github.event.inputs.tujuan != 'cek-tt' && github.event.inputs.tujuan != 'cek-tg'
        run: |
          git fetch -q origin hasil
          git show origin/hasil:${{ github.event.inputs.berkas }}.mp4 > ${{ github.event.inputs.berkas }}.mp4
          git show origin/hasil:${{ github.event.inputs.berkas }}_caption.txt > ${{ github.event.inputs.berkas }}_caption.txt
          for sfx in _ig _yt _fb _tt; do
            git show origin/hasil:${{ github.event.inputs.berkas }}_caption${sfx}.txt > ${{ github.event.inputs.berkas }}_caption${sfx}.txt 2>/dev/null || true
          done
      - name: Posting
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BERKAS: ${{ github.event.inputs.berkas }}
          TUJUAN: ${{ github.event.inputs.tujuan }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_MODE: ${{ vars.TT_MODE || 'direct' }}
          TT_PRIVACY: ${{ vars.TT_PRIVACY || 'SELF_ONLY' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python posting_uji.py
